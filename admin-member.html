<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members — Spade Gym</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body class="admin-body">
  <div class="admin-layout">

    <!-- SIDEBAR -->
    <aside class="admin-sidebar" aria-label="Admin Sidebar Navigation">
      <div class="sidebar-header">
        <span class="logo-icon">&#9824;</span>
        <span class="sidebar-brand">Spade GYM</span>
        <span class="sidebar-label">Admin</span>
      </div>
      <nav aria-label="Admin Navigation">
        <ul class="sidebar-nav">
          <li><a href="admin-dashboard.html" class="sidebar-link">🏠 Dashboard</a></li>
          <li><a href="admin-member.html"    class="sidebar-link active">👥 Members</a></li>
          <li><a href="admin-classes.html"   class="sidebar-link">📅 Classes</a></li>
          <li><a href="#"                    class="sidebar-link">💳 Subscriptions</a></li>
          <li><a href="admin-plans.html"     class="sidebar-link">📋 Plans</a></li>
          <li><a href="#"                    class="sidebar-link">🏋️ Trainers</a></li>
          <li><a href="#"                    class="sidebar-link">✉️ Messages <span class="badge-count">12</span></a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html"       class="sidebar-link">🌐 View Site</a>
        <a href="admin-login.html" class="sidebar-link sidebar-logout">🚪 Logout</a>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="admin-main" id="admin-content">

      <header class="admin-topbar">
        <button class="admin-menu-toggle" aria-label="Toggle sidebar">☰</button>
        <h1 class="admin-page-title">Members</h1>
        <div class="admin-topbar-right">
          <span class="admin-user-info">👤 Admin — superadmin</span>
        </div>
      </header>

      <!-- MEMBERS TABLE -->
      <section class="admin-section" aria-labelledby="recent-heading">
        <h2 id="recent-heading" class="admin-section-title">All Members</h2>
        <div class="admin-card">
          <div class="admin-card-header">
            <span>Members List</span>
          </div>
          <div class="table-responsive">
            <table class="admin-table">
              <caption class="sr-only">All gym members with management actions</caption>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Full Name</th>
                  <th>Email</th>
                  <th>Plan</th>
                  <th>Join Date</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="admin-member.js"></script>
</body>
</html>
